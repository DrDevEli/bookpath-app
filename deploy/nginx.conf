# BookPath — bookpath.org site config.
#
# Install:
#   cp deploy/nginx.conf /etc/nginx/sites-available/bookpath
#   ln -s /etc/nginx/sites-available/bookpath /etc/nginx/sites-enabled/bookpath
#   nginx -t && systemctl reload nginx
#
# SSL certs managed by certbot (bookpath.org + www.bookpath.org).
# www -> apex 301 keeps authority on a single host (no duplicate content).

# ---- www.bookpath.org -> bookpath.org (301) -------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.bookpath.org;

    ssl_certificate /etc/letsencrypt/live/bookpath.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bookpath.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://bookpath.org$request_uri;
}

# ---- apex: bookpath.org (SSL) --------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name bookpath.org;

    root /opt/bookpath/frontend/build;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/bookpath.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bookpath.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # ---- Security headers (static surface; Helmet covers /api responses) ----
    # Audit H4: the SPA HTML previously had zero security headers.
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # React SPA loads its own hashed bundles from 'self'; Google Books covers /
    # Amazon images come from https: origins; Montserrat/Open Sans/Lato fonts
    # load from fonts.googleapis.com (CSS) + fonts.gstatic.com (WOFF2).
    # script-src keeps 'unsafe-inline' only where the CRA runtime injects inline
    # scripts — tighten later with a nonce once the bundle is migrated off CRA
    # (see audit H4/H5).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self'; object-src 'none'; frame-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Static assets (content-hashed filenames) — cache aggressively.
    # NOTE: a location-level add_header replaces inherited ones, so repeat
    # nosniff here (defense for JS/CSS MIME sniffing).
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # ---- Backend (Express on 127.0.0.1:3001) --------------------------------
    # SEO landing pages: server-rendered HTML. These regex/exact matches MUST
    # precede the SPA fallback below, otherwise /books/genre/... would be
    # swallowed by the SPA's /books/:id client route.
    location ~ ^/books/(genre|topic|author)/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /seo {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /robots.txt {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /health {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # REST API + Swagger docs.
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # Swagger docs — prefix match so /api-docs/* also reaches the backend,
    # which 404s it in production (audit M5). Without this, subpaths fell
    # through to the SPA catch-all and returned index.html (soft 200).
    location ^~ /api-docs {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- SPA (React client-side routes) --------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ---- HTTP -> HTTPS (www to apex, apex to https) ---------------------------
server {
    listen 80;
    listen [::]:80;
    server_name www.bookpath.org;
    return 301 https://bookpath.org$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name bookpath.org;
    return 301 https://bookpath.org$request_uri;
}
