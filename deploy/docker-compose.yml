# BookPath production infrastructure — MongoDB + Redis.
#
# SECURITY: bind to 127.0.0.1 ONLY. Never expose a database port publicly —
# an internet-facing MongoDB with no auth is the #1 target for automated
# ransomware/wipe attacks. The backend reaches both over localhost.
services:
  mongo:
    image: mongo:7
    container_name: bookpath-mongo
    restart: unless-stopped
    command: ["mongod", "--bind_ip", "127.0.0.1"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7-alpine
    container_name: bookpath-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--bind", "127.0.0.1"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data

volumes:
  mongo-data:
  redis-data:
