# BookPath production infrastructure — MongoDB + Redis.
#
# SECURITY: the `127.0.0.1:` port bindings below expose these ONLY on the host's
# loopback (never publicly). Do NOT add `--bind_ip`/`--bind 127.0.0.1` inside the
# container — that binds to the *container's* loopback, which Docker's
# port-forward (targeting the container's eth0) cannot reach.
services:
  mongo:
    image: mongo:7
    container_name: bookpath-mongo
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7-alpine
    container_name: bookpath-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data

volumes:
  mongo-data:
  redis-data:
