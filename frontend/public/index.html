<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="google-site-verification" content="RvMwEX2gh1AJrNnnxFuAvaXuNDahJ0Om8X3nyNsyD_k" />
    <link rel="icon" type="image/png" href="%PUBLIC_URL%/bookpath_logo_option3_updated.png" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/bookpath_icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0A0A35" />

    <title>BookPath — Find Your Next Great Read | Curated Book Lists</title>
    <meta
      name="description"
      content="Discover your next great read. 150+ curated book lists by genre, author and topic — real covers, honest picks and one click to buy. Build your personal library on BookPath."
    />
    <link rel="canonical" href="https://bookpath.org/" />

    <!-- Social sharing. Without these, any post of a BookPath link unfurls as a
         bare URL: no image, no title, no description. Per-book and landing pages
         get their own tags server-side (nginx routes crawlers to the rendered
         HTML); these are the defaults for the app itself. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BookPath" />
    <meta property="og:title" content="BookPath — Find your next great read" />
    <meta
      property="og:description"
      content="150+ curated book lists by genre, author and topic. Real covers, honest picks, one click to buy."
    />
    <meta property="og:url" content="https://bookpath.org/" />
    <meta property="og:image" content="https://bookpath.org/og-image.png" />
    <meta property="og:image:secure_url" content="https://bookpath.org/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="BookPath — find your next great read, with real book covers" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="de_DE" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BookPath — Find your next great read" />
    <meta
      name="twitter:description"
      content="150+ curated book lists by genre, author and topic. Real covers, honest picks, one click to buy."
    />
    <meta name="twitter:image" content="https://bookpath.org/og-image.png" />
    <meta name="twitter:image:alt" content="BookPath — find your next great read, with real book covers" />

    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <!-- Google Fonts: Montserrat, Open Sans, Lato -->
    <link href="https://fonts.googleapis.com/css?family=Montserrat:700,600,400&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css?family=Open+Sans:400,300,600&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css?family=Lato:400italic,700italic&display=swap" rel="stylesheet" />
    <!-- Hero/branding images will be referenced in React components -->
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
